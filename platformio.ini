; PlatformIO - Dashboard de combustíveis
; Placa: ESP32-2432S028 ("Cheap Yellow Display" / CYD)
;   - Ecrã ILI9341 240x320 SPI (já integrado — não é preciso ligar fios)
;   - Backlight no GPIO 21, LED RGB nos GPIO 4/16/17
;
; NOTA sobre o controlador: a maioria destas placas funciona com
; ILI9341_2_DRIVER. Algumas revisões (sobretudo as com USB-C) mostram as cores
; trocadas/invertidas — nesse caso troca para "ILI9341_DRIVER" ou vice-versa,
; ou vê a secção de resolução de problemas no README.

[env:esp32-2432S028]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    bblanchon/ArduinoJson @ ^7.0.4
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git

build_flags =
    ; ---- Controlador do ecrã (CYD) ----
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320

    ; ---- Pinos do ecrã (fixos nesta placa) ----
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH

    ; ---- Fontes / SPI ----
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
