name: previsao

# Só a previsão (leve). O workflow diário 'coletar' já busca a previsão de manhã;
# este corre ao fim da tarde de 5a a domingo, para apanhar no próprio dia a
# previsão da semana seguinte (que o site costuma publicar a partir de 5a feira)
# e eventuais afinações até à confirmação de 2a. Nunca apaga a previsão anterior.
on:
  schedule:
    - cron: "10 16 * * 4,5,6,0"   # 16:10 UTC, quinta/sexta/sabado/domingo
  workflow_dispatch:

jobs:
  previsao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Recolher previsao
        run: node scripts/coletar.mjs
        env:
          SO_PREVISAO: "1"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JINA_KEY: ${{ secrets.JINA_KEY }}
